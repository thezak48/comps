[project]
name = "comps"
version = "0.1.0"
description = "Comps: open source self-hostable version of Slowpoke Pics"
authors = [
	{ name = "thezak48" }
]

requires-python = ">=3.13"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [
    ".pytest_cache",
    ".pytest-tmp",
    "venv",
    "env",
    "static",
    "templates",
    "migrations",
    "node_modules",
]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E203"]

[tool.ruff.lint.isort]
known-first-party = ["api"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --basetemp=.pytest-tmp"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["api", "auth", "database", "database_metrics", "db", "main", "migrations", "storage"]

[tool.coverage.report]
show_missing = true
skip_covered = true
