[project]
name = "comps"
version = "0.1.0"
description = "Comps: open source self-hostable version of Slowpoke Pics"
authors = [
	{ name = "thezak48" }
]

requires-python = ">=3.13"

[tool.black]
line-length = 100
target-version = ['py38']
include = '\.pyi?$'
exclude = '''
/(\.pytest_cache|\.pytest-tmp|venv|env|\.venv|static|templates|migrations|node_modules)/
'''

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --basetemp=.pytest-tmp"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["api", "auth", "database", "database_metrics", "db", "main", "migrations", "storage"]

[tool.coverage.report]
show_missing = true
skip_covered = true
