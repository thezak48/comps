name: CI

on:
    push:
        paths-ignore:
            - "README.md"
            - "CONTRIBUTING.md"
            - "renovate.json"
            - ".github/ISSUE_TEMPLATE/**"
            - "PULL_REQUEST_TEMPLATE.md"
            - "docs/**"
    pull_request:
        paths-ignore:
            - "README.md"
            - "CONTRIBUTING.md"
            - "renovate.json"
            - ".github/ISSUE_TEMPLATE/**"
            - "PULL_REQUEST_TEMPLATE.md"
            - "docs/**"

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        name: Lint and format
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.15"
                  cache: pip
                  cache-dependency-path: requirements-dev.txt
            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "lts/*"
                  cache: npm
            - name: Install Python lint dependencies
              run: python -m pip install -r requirements-dev.txt
            - name: Install Node.js dependencies
              run: npm ci --ignore-scripts
            - name: Run Black
              run: black --check .
            - name: Run isort
              run: isort --check-only .
            - name: Run Flake8
              run: flake8 .
            - name: Run djLint
              run: djlint templates/ --check --profile=jinja
            - name: Run static asset checks
              run: npm run check

    test:
        name: Test
        needs: lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.15"
                  cache: pip
                  cache-dependency-path: |
                      requirements.txt
                      requirements-dev.txt
            - name: Install dependencies
              run: python -m pip install -r requirements.txt -r requirements-dev.txt
            - name: Run tests with branch coverage
              run: python -m pytest --cov --cov-report=term-missing --cov-fail-under=75

    build:
        name: Build and publish
        needs: test
        if: >-
            (github.event_name == 'pull_request' && github.base_ref == 'develop') ||
            (github.event_name == 'push' &&
            (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/')))
        runs-on: ubuntu-latest
        timeout-minutes: 60
        permissions:
            contents: read
            packages: write
            security-events: write
            id-token: write
        steps:
            - name: Checkout code
              uses: actions/checkout@v7
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
            - name: Build image for validation
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  load: true
                  tags: comps-ci:${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
            - name: Smoke test container startup
              timeout-minutes: 2
              env:
                  IMAGE: comps-ci:${{ github.sha }}
                  CONTAINER_NAME: comps-smoke-${{ github.run_id }}-${{ github.run_attempt }}
              run: |
                  set -euo pipefail

                  cleanup() {
                      exit_code=$?
                      if [ "$exit_code" -ne 0 ]; then
                          docker logs "$CONTAINER_NAME" || true
                      fi
                      docker rm --force --volumes "$CONTAINER_NAME" >/dev/null 2>&1 || true
                      exit "$exit_code"
                  }
                  trap cleanup EXIT

                  docker run --detach --name "$CONTAINER_NAME" \
                      --publish 127.0.0.1::8000 "$IMAGE" >/dev/null
                  address=$(docker port "$CONTAINER_NAME" 8000/tcp)
                  deadline=$((SECONDS + 60))

                  until curl --fail --silent --max-time 2 "http://$address/health" >/dev/null; do
                      if [ "$(docker inspect --format '{{.State.Running}}' "$CONTAINER_NAME")" != "true" ]; then
                          echo "Container exited before becoming healthy"
                          exit 1
                      fi
                      if [ "$SECONDS" -ge "$deadline" ]; then
                          echo "Container did not become healthy within 60 seconds"
                          exit 1
                      fi
                      sleep 1
                  done

                  echo "Container health check passed"
            - name: Scan image with Trivy
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                  image-ref: comps-ci:${{ github.sha }}
                  format: sarif
                  output: trivy-results.sarif
            - name: Upload Trivy scan results
              if: always()
              continue-on-error: true
              uses: github/codeql-action/upload-sarif@v4
              with:
                  sarif_file: trivy-results.sarif
            - name: Generate SBOM
              uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
              with:
                  image: comps-ci:${{ github.sha }}
            - name: Docker metadata
              if: github.event_name == 'push'
              id: meta
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
              with:
                  images: |
                      ghcr.io/thezak48/comps
                      thezak48/comps
                  flavor: |
                      latest=${{ github.ref_type == 'tag' }}
                  tags: |
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=semver,pattern={{major}}
                      type=edge,branch=develop
                      type=sha,format=long
                      type=sha
            - name: Login to GHCR
              if: github.event_name == 'push'
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ github.token }}
            - name: Login to Docker Hub
              if: github.event_name == 'push'
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: docker.io
                  username: ${{ vars.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}
            - name: Publish multi-platform image
              if: github.event_name == 'push'
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  provenance: true
                  sbom: true
