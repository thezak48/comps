name: CI

on:
    push:
        paths-ignore:
            - "README.md"
            - "CONTRIBUTING.md"
            - "renovate.json"
            - ".github/ISSUE_TEMPLATE/**"
            - "PULL_REQUEST_TEMPLATE.md"
            - "docs/**"
    pull_request:
        paths-ignore:
            - "README.md"
            - "CONTRIBUTING.md"
            - "renovate.json"
            - ".github/ISSUE_TEMPLATE/**"
            - "PULL_REQUEST_TEMPLATE.md"
            - "docs/**"

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        name: Lint and format
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.13"
                  cache: pip
                  cache-dependency-path: requirements-dev.txt
            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "lts/*"
                  cache: npm
            - name: Install Python lint dependencies
              run: python -m pip install -r requirements-dev.txt
            - name: Install Node.js dependencies
              run: npm ci
            - name: Run Black
              run: black --check .
            - name: Run isort
              run: isort --check-only .
            - name: Run Flake8
              run: flake8 .
            - name: Run djLint
              run: djlint templates/ --check --profile=jinja
            - name: Run static asset checks
              run: npm run check

    test:
        name: Test
        needs: lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.13"
                  cache: pip
                  cache-dependency-path: |
                      requirements.txt
                      requirements-dev.txt
            - name: Install dependencies
              run: python -m pip install -r requirements.txt -r requirements-dev.txt
            - name: Run tests with branch coverage
              run: python -m pytest --cov --cov-report=term-missing --cov-fail-under=75

    build:
        name: Build and publish
        needs: test
        if: >-
            (github.event_name == 'pull_request' && github.base_ref == 'develop') ||
            (github.event_name == 'push' &&
            (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/')))
        runs-on: ubuntu-latest
        timeout-minutes: 60
        permissions:
            contents: read
            packages: write
            security-events: write
            id-token: write
        steps:
            - name: Checkout code
              uses: actions/checkout@v7
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3
            - name: Build image for validation
              uses: docker/build-push-action@v7
              with:
                  context: .
                  load: true
                  tags: comps-ci:${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
            - name: Scan image with Trivy
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                  image-ref: comps-ci:${{ github.sha }}
                  format: sarif
                  output: trivy-results.sarif
            - name: Upload Trivy scan results
              if: always()
              continue-on-error: true
              uses: github/codeql-action/upload-sarif@v4
              with:
                  sarif_file: trivy-results.sarif
            - name: Generate SBOM
              uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
              with:
                  image: comps-ci:${{ github.sha }}
            - name: Docker metadata
              if: github.event_name == 'push'
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: |
                      ghcr.io/thezak48/comps
                      thezak48/comps
                  flavor: |
                      latest=${{ github.ref_type == 'tag' }}
                  tags: |
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=semver,pattern={{major}}
                      type=edge,branch=develop
                      type=sha,format=long
                      type=sha
            - name: Login to GHCR
              if: github.event_name == 'push'
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ github.token }}
            - name: Login to Docker Hub
              if: github.event_name == 'push'
              uses: docker/login-action@v4
              with:
                  registry: docker.io
                  username: ${{ vars.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}
            - name: Publish multi-platform image
              if: github.event_name == 'push'
              uses: docker/build-push-action@v7
              with:
                  context: .
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  provenance: true
                  sbom: true
